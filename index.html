
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova - Smart Calculator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="calculator">
        <header class="top-bar">
            

            <div class="status-dot" title="Calculator ready"></div>
        </header>

        <section class="display" aria-label="Calculator display">
            <p class="display-label">YOUR CALCULATION</p>

            <div id="expression" class="expression" aria-live="polite">
                Ready to calculate
            </div>

            <output id="result" class="result" aria-live="polite"
                    aria-atomic="true">0</output>
        </section>

        <section class="keypad" aria-label="Calculator keypad">
            <button class="key utility" data-action="clear">AC</button>
            <button class="key utility" data-action="delete"
                    aria-label="Delete last digit">DEL</button>
            <button class="key utility" data-action="percent">%</button>
            <button class="key operator" data-operator="/"
                    aria-label="Divide">÷</button>

            <button class="key" data-number="7">7</button>
            <button class="key" data-number="8">8</button>
            <button class="key" data-number="9">9</button>
            <button class="key operator" data-operator="*"
                    aria-label="Multiply">×</button>

            <button class="key" data-number="4">4</button>
            <button class="key" data-number="5">5</button>
            <button class="key" data-number="6">6</button>
            <button class="key operator" data-operator="-"
                    aria-label="Subtract">−</button>

            <button class="key" data-number="1">1</button>
            <button class="key" data-number="2">2</button>
            <button class="key" data-number="3">3</button>
            <button class="key operator" data-operator="+"
                    aria-label="Add">+</button>

            <button class="key utility" data-action="sign"
                    aria-label="Change sign">+/−</button>
            <button class="key" data-number="0">0</button>
            <button class="key" data-action="decimal">.</button>
            <button class="key equals" data-action="equals"
                    aria-label="Calculate result">=</button>
        </section>

        <footer class="calculator-footer">
            <span><span class="footer-dot"></span> SYSTEM ONLINE</span>
            <span>DESIGNED FOR YOU</span>
        </footer>
    </main>

</body>
</html>
